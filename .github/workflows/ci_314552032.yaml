name: ci_314552032

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-314552032-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        shell: bash
        run: |
          set +e
          output="$(npm run typecheck 2>&1)"
          status=$?
          echo "$output"

          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^([^[:space:]]+)\(([0-9]+),([0-9]+)\):[[:space:]]error[[:space:]](TS[0-9]+):[[:space:]](.*)$ ]]; then
                echo "::error file=${BASH_REMATCH[1]},line=${BASH_REMATCH[2]},col=${BASH_REMATCH[3]},title=TypeScript ${BASH_REMATCH[4]}::${BASH_REMATCH[5]}"
              fi
            done <<< "$output"
          fi

          exit "$status"

      - name: Prettier check
        shell: bash
        run: |
          set +e
          output="$(npx prettier --check . 2>&1)"
          status=$?
          echo "$output"

          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^\[warn\][[:space:]](.+)$ ]]; then
                file="${BASH_REMATCH[1]}"
                echo "::error file=${file},title=Prettier check failed::Run npm run format to format this file."
              fi
            done <<< "$output"
          fi

          exit "$status"

      - name: Test
        run: npm test -- --reporter=github-actions
